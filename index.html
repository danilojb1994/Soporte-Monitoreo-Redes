<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Soporte Interno OPC</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <section class="page-auth">
    <div class="auth-card">
      <div class="brand">
        <img src="assets/opc-logo.svg" alt="OPC logo">
        <div>
          <p class="brand-title">Portal Soporte OPC</p>
          <p class="brand-subtitle">Acceso seguro para empleados y administradores</p>
        </div>
      </div>
      <h1>Iniciar sesión</h1>
      <p>Ingresa tu correo corporativo y contraseña para acceder al portal interno.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" placeholder="empleado@opc.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn fullwidth" type="submit">Ingresar</button>
        <p id="loginMessage" class="small-note" style="margin-top: 16px;"></p>
      </form>
      <div class="small-note">
        <strong>Credenciales de prueba</strong><br>
        Empleado: empleado@opc.com / pass123<br>
        Administrador: admin@opc.com / admin123
      </div>
    </div>
  </section>

  <script src="js/utils.js"></script>
  <script src="js/tickets.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
