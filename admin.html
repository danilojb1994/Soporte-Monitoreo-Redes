<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal OPC - Administrador</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="page-wrapper">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/opc-logo.svg" alt="OPC logo">
        <div>
          <p class="brand-title">Portal Soporte OPC</p>
          <p class="brand-subtitle">Panel de administrador</p>
        </div>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="nuevo-ticket.html">Crear ticket</a></li>
          <li><a class="active" href="admin.html">Panel administrador</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <p>Filtra, asigna y gestiona tickets.</p>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1 class="welcome-title">Panel administrador</h1>
          <p class="welcome-subtitle">Usuario: <span class="user-name"></span> · <span class="user-role"></span></p>
        </div>
        <button class="logout-button">Cerrar sesión</button>
      </div>

      <div class="form-card">
        <div class="section-header" style="margin-bottom:14px;">
          <h2>Control de tickets</h2>
          <button id="exportCsvBtn" class="btn secondary">Exportar a CSV</button>
        </div>
        <div class="filter-row">
          <select id="filterEstado"></select>
          <select id="filterCategoria"></select>
          <select id="filterPrioridad"></select>
          <input id="searchTicket" type="text" placeholder="Buscar por ID o palabra clave">
        </div>
      </div>

      <div class="table-card" style="margin-top:20px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Categoría</th>
              <th>Prioridad</th>
              <th>Estado</th>
              <th>Asignado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="adminTicketBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/tickets.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
